name: Claude Code Review

# Automatic review on every pull request is DISABLED.
#
# The workflow runs and reviews correctly, but posts nothing: every run ends
# with "No buffered inline comments" and no comment appears on the pull
# request. That held on a substantial code change (39 turns, ~$1.11 on #18),
# so it is not the reviewer deciding a PR is too trivial to review.
#
# Adding --comment and the inline-comment tool to claude_args (#17) did not
# fix it, and the cause is still unknown; the action runs with
# show_full_output: false, so the review's own conclusion never reaches the
# log. Left enabled it costs roughly a dollar of usage per pull request and
# produces nothing readable.
#
# Meanwhile, mentioning @claude on a pull request works and posts correctly.
# That path is handled by claude.yml.
#
# To re-enable, restore the pull_request trigger below. Before doing so, set
# show_full_output: true on the action step so the log shows what the review
# concluded.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string
  # pull_request:
  #   types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ inputs.pr_number || github.event.pull_request.number }}'
          # Required even though the skill's own allowed-tools frontmatter names
          # the same tool: the action starts the inline-comment MCP server only
          # when --allowedTools in claude_args names it.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

