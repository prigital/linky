name: Feature request
description: Suggest an idea
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need rather than a specific implementation, if you can.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: keyboard
    attributes:
      label: How would this work from the keyboard?
      description: >
        Linky must be fully usable without a mouse. If your idea involves a new
        interaction, sketch the keyboard path for it. Leave blank if not applicable.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
